name: trackme
description: A premium, AI-powered fitness application built with Flutter.
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  
  # UI & Design System
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  phosphor_flutter: ^2.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  glassmorphism: ^3.0.0
  confetti: ^0.7.0
  flutter_colorpicker: ^1.1.0
  
  # Data Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  
  # Features & Capabilities
  fl_chart: ^0.69.0
  pedometer: ^3.0.0
  flutter_local_notifications: ^17.2.1
  
  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # assets:
  #   - assets/lottie
  #   - assets/images
  #   - assets/icons
